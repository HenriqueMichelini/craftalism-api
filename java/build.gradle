plugins {
    id 'java'
    id 'jacoco'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id "org.sonarqube" version "7.3.0.8198"
}

group = 'io.github.HenriqueMichelini'
version = '0.0.1-SNAPSHOT'
description = 'Core API for Craftalism Ecosystem'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

def localEnvValue = { String key ->
    def environmentValue = System.getenv(key)
    if (environmentValue != null && !environmentValue.isBlank()) {
        return environmentValue
    }

    def envFile = rootProject.file('.env')
    if (!envFile.isFile()) {
        return null
    }

    def prefixPattern = ~/^\s*${java.util.regex.Pattern.quote(key)}\s*=\s*/
    def matchingLine = envFile.readLines('UTF-8')
            .find { line -> line ==~ /^\s*${java.util.regex.Pattern.quote(key)}\s*=.*/ }
    if (matchingLine == null) {
        return null
    }

    def value = matchingLine.replaceFirst(prefixPattern, '').trim()
    if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
        value = value.substring(1, value.length() - 1)
    }
    return value.isBlank() ? null : value
}

sonar {
    properties {
        property "sonar.projectKey", "HenriqueMichelini_craftalism-api"
        property "sonar.sourceEncoding", "UTF-8"
        property "sonar.coverage.jacoco.xmlReportPaths", layout.buildDirectory.file("reports/jacoco/test/jacocoTestReport.xml").get().asFile.path
        property "sonar.scanner.skipJreProvisioning", "true"

        def sonarHostUrl = localEnvValue('SONAR_HOST_URL')
        if (sonarHostUrl != null) {
            property "sonar.host.url", sonarHostUrl
        }

        def sonarOrganization = localEnvValue('SONAR_ORGANIZATION') ?: (sonarHostUrl == null ? 'henriquemichelini' : null)
        if (sonarOrganization != null) {
            property "sonar.organization", sonarOrganization
        }

        def sonarToken = localEnvValue('SONAR_TOKEN')
        if (sonarToken != null) {
            property "sonar.token", sonarToken
        }
    }
}

repositories {
    mavenCentral()
}

configurations.configureEach {
    resolutionStrategy {
        force 'org.springframework:spring-web:6.2.12'
        force 'org.springframework:spring-webmvc:6.2.12'
    }
}

ext {
    mapstructVersion = '1.6.3'
    springdocVersion = '2.8.14'
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation "org.springframework.boot:spring-boot-starter-oauth2-resource-server"

    // MapStruct (DTO Mapping)
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"

    // Database Drivers
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'

    // Database Migrations
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // API Documentation
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"

    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.springframework.security:spring-security-test'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('sonar') {
    dependsOn tasks.named('classes')
    dependsOn tasks.named('test')
    dependsOn tasks.named('jacocoTestReport')
}

tasks.named('bootJar') {
    archiveFileName = 'app.jar'
}

tasks.named('jar') {
    enabled = false
}
